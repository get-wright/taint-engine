[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taint-engine"
version = "0.1.0"
description = "Tree-sitter-based intraprocedural taint tracing engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
taint-trace = "taint_engine.cli.main:main"

[project.optional-dependencies]
# Engine-only consumers — keep >=0.23.0 for backward compat
parsers = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
]
# CLI requires 0.25.x QueryCursor behavior plus TS / TSX grammar support
cli = [
    "tree-sitter>=0.25.0,<0.26.0",
    "tree-sitter-python>=0.25.0,<0.26.0",
    "tree-sitter-javascript>=0.25.0,<0.26.0",
    "tree-sitter-typescript>=0.23.2,<0.24.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "tree-sitter>=0.25.0,<0.26.0",
    "tree-sitter-python>=0.25.0,<0.26.0",
    "tree-sitter-javascript>=0.25.0,<0.26.0",
    "tree-sitter-typescript>=0.23.2,<0.24.0",
]

[tool.setuptools.packages.find]
include = ["taint_engine*"]

[tool.setuptools.package-data]
"taint_engine.rules" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
