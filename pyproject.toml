[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taint-engine"
version = "0.1.0"
description = "Tree-sitter-based intraprocedural taint tracing engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.optional-dependencies]
# tree-sitter grammars needed to actually parse files
# Install these in the consumer project
parsers = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
]
dev = [
    "pytest>=8.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["taint_engine*"]

[tool.setuptools.package-data]
"taint_engine.rules" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
